services:
  - type: web
    name: glaucoai-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: GLAUCOAI_REMOTE
        value: "1"
      - key: GLAUCOAI_ACCESS_TOKEN
        sync: false
      - key: GLAUCOAI_CHECKPOINT_URL
        sync: false
